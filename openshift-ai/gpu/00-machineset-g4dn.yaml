apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  annotations:
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64
    machine.openshift.io/GPU: "1"
    machine.openshift.io/memoryMb: "16384"
    machine.openshift.io/vCPU: "4"
  labels:
    machine.openshift.io/cluster-api-cluster: agentic-ai-demo-tlrpb
  name: agentic-ai-demo-tlrpb-gpu-us-east-1a
  namespace: openshift-machine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: agentic-ai-demo-tlrpb
      machine.openshift.io/cluster-api-machineset: agentic-ai-demo-tlrpb-gpu-us-east-1a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: agentic-ai-demo-tlrpb
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: agentic-ai-demo-tlrpb-gpu-us-east-1a
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/worker: ""
          cluster-api/accelerator: nvidia-tesla-t4
      providerSpec:
        value:
          ami:
            id: ami-0b7812c349a73ee5c
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
            - ebs:
                encrypted: true
                iops: 2000
                kmsKey:
                  arn: ""
                volumeSize: 120
                volumeType: io1
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: agentic-ai-demo-tlrpb-worker-profile
          instanceType: g4dn.xlarge
          kind: AWSMachineProviderConfig
          metadata: {}
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-1a
            region: us-east-1
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - agentic-ai-demo-tlrpb-node
            - filters:
                - name: tag:Name
                  values:
                    - agentic-ai-demo-tlrpb-lb
          subnet:
            filters:
              - name: tag:Name
                values:
                  - agentic-ai-demo-tlrpb-subnet-private-us-east-1a
          tags:
            - name: kubernetes.io/cluster/agentic-ai-demo-tlrpb
              value: owned
          userDataSecret:
            name: worker-user-data
