apiVersion: batch/v1
kind: Job
metadata:
  name: agent-b
  namespace: agentic-ai
  labels:
    app: incident-agent
    agent: agent-b
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: incident-agent
        agent: agent-b
    spec:
      restartPolicy: Never
      serviceAccountName: agent-b
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/agentic-ai/incident-agent:latest
          imagePullPolicy: Always
          env:
            - name: AGENT_NAME
              value: agent-b
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
