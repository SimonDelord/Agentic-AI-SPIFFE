apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
spec:
  logLevel: info
  logFormat: text
  jwtIssuer: https://oidc-discovery.apps.agentic-ai-demo.sandbox1133.opentlc.com
  caValidity: 24h
  defaultX509Validity: 1h
  defaultJWTValidity: 5m
  jwtKeyType: rsa-2048
  caSubject:
    country: AU
    organization: Agentic AI SPIFFE demo
    commonName: SPIRE Server CA
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  datastore:
    databaseType: sqlite3
    connectionString: /run/spire/data/datastore.sqlite3
    maxOpenConns: 100
    maxIdleConns: 10
    connMaxLifetime: 0
    disableMigration: "false"
